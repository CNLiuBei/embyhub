# Nginx配置示例 - 飞牛用户系统域名白名单

# ============================================
# 方案1: HTTP only（简单，适合开发/测试）
# ============================================

server {
    listen 80;
    server_name fnhub.trueliu.com;
    
    # 前端静态文件或Vite开发服务器
    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
    
    # 后端API
    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# ============================================
# 方案2: HTTPS（生产环境推荐）
# ============================================

# HTTP重定向到HTTPS
server {
    listen 80;
    server_name fnhub.trueliu.com;
    
    # 自动重定向到HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS配置
server {
    listen 443 ssl http2;
    server_name fnhub.trueliu.com;
    
    # SSL证书配置（必须配置）
    ssl_certificate /path/to/your/certificate.crt;      # 修改为你的证书路径
    ssl_certificate_key /path/to/your/private.key;      # 修改为你的私钥路径
    
    # SSL优化配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # 前端
    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        
        # WebSocket支持（如果需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # 后端API
    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# ============================================
# 方案3: 使用Let's Encrypt免费证书
# ============================================

# 第1步：先配置HTTP，用于Let's Encrypt验证
server {
    listen 80;
    server_name fnhub.trueliu.com;
    
    # Let's Encrypt验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # 其他请求重定向到HTTPS（证书获取后启用）
    # return 301 https://$server_name$request_uri;
    
    # 临时使用HTTP（获取证书前）
    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# 第2步：获取证书后添加HTTPS配置
# certbot certonly --webroot -w /var/www/certbot -d fnhub.trueliu.com

