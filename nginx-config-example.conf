# ============================================
# 宝塔面板用户专用配置
# ============================================

# 如果使用宝塔面板，建议通过面板界面配置：
# 1. 网站 → 选择站点 → 设置
# 2. SSL → 申请Let's Encrypt证书
# 3. 或上传自己的证书
# 4. 配置反向代理：
#    - 代理名称：前端
#    - 目标URL：http://localhost:3000
#    - 发送域名：$host
#    - 添加代理：
#      - 代理名称：后端API
#      - 目标URL：http://localhost:8080
#      - 代理路径：/api/

# ============================================
# 域名白名单配合Nginx
# ============================================

# 只允许特定域名访问
server {
    listen 80;
    server_name fnhub.trueliu.com;  # 白名单域名
    
    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# 拒绝其他所有域名
server {
    listen 80 default_server;
    server_name _;
    
    # 返回403错误
    return 403 "Domain not authorized";
}

