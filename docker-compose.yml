version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: embyhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-embyhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-embyhub123}
      POSTGRES_DB: ${DB_NAME:-embyhub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - embyhub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-embyhub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: embyhub-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - embyhub-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务
  backend:
    image: registry.cn-hangzhou.aliyuncs.com/lightsail/embyhub-backend:latest
    container_name: embyhub-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-embyhub}
      - DB_PASSWORD=${DB_PASSWORD:-embyhub123}
      - DB_NAME=${DB_NAME:-embyhub}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-your-secret-key}
    volumes:
      - ./backend/config:/app/config
      - ./backend/logs:/app/logs
      - ./backend/uploads:/app/uploads
      - ./backend/bin:/app/bin
      - cloudflared_data:/root/.cloudflared
    ports:
      - "54680:8080"
    networks:
      - embyhub-network

  # Emby代理服务
  emby-proxy:
    image: registry.cn-hangzhou.aliyuncs.com/lightsail/embyhub-emby-proxy:latest
    container_name: embyhub-emby-proxy
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-embyhub}
      - DB_PASSWORD=${DB_PASSWORD:-embyhub123}
      - DB_NAME=${DB_NAME:-embyhub}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./backend/config:/app/config
      - ./backend/logs:/app/logs
    ports:
      - "54682:54682"
    networks:
      - embyhub-network

  # 前端服务
  frontend:
    image: registry.cn-hangzhou.aliyuncs.com/lightsail/embyhub-frontend:latest
    container_name: embyhub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "54681:80"
    networks:
      - embyhub-network

volumes:
  postgres_data:
  redis_data:
  cloudflared_data:

networks:
  embyhub-network:
    driver: bridge
