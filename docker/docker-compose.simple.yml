version: '3.8'

# EmbyHub Docker 部署配置
# 使用方法: docker compose up -d
# 配置文件已内置到镜像，开箱即用

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: embyhub-postgres
    restart: always
    environment:
      POSTGRES_USER: embyhub
      POSTGRES_PASSWORD: embyhub123
      POSTGRES_DB: embyhub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - embyhub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U embyhub -d embyhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: embyhub-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - embyhub-network

  # 后端服务
  backend:
    image: ghcr.io/cnliubei/embyhub-backend:latest
    container_name: embyhub-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      # 配置文件已内置到镜像，如需自定义可取消下行注释
      # - ./config/config.yaml:/app/config/config.yaml
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
      - ./bin:/app/bin
    ports:
      - "54680:8080"
    networks:
      - embyhub-network

  # 前端服务
  frontend:
    image: ghcr.io/cnliubei/embyhub-frontend:latest
    container_name: embyhub-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "54681:80"
    networks:
      - embyhub-network

volumes:
  postgres_data:
  redis_data:
  backend_logs:
  backend_uploads:

networks:
  embyhub-network:
    driver: bridge
