version: '3.8'

# 简化版 - 使用预编译二进制文件
services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: feiniu-postgres
    restart: always
    environment:
      POSTGRES_USER: fnuser
      POSTGRES_PASSWORD: fnuser123
      POSTGRES_DB: feiniu_user
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fnuser -d feiniu_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: feiniu-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    ports:
      - "16379:6379"

  # 主服务 + Emby代理 + Nginx (All-in-One)
  feiniu:
    image: nginx:alpine
    container_name: feiniu-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend:/usr/share/nginx/html
      - ./config:/app/config
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./server:/app/server
      - ./emby-proxy:/app/emby-proxy
      - ./start.sh:/app/start.sh
    ports:
      - "54681:80"
      - "54680:54680"
      - "54682:54682"
    entrypoint: ["/bin/sh", "/app/start.sh"]
