version: '3.8'

# 从二进制部署迁移到Docker镜像部署
# 保留现有的 PostgreSQL 和 Redis 数据

services:
  # PostgreSQL 数据库 - 保持不变
  postgres:
    image: postgres:15-alpine
    container_name: feiniu-postgres
    restart: always
    environment:
      POSTGRES_USER: fnuser
      POSTGRES_PASSWORD: fnuser123
      POSTGRES_DB: feiniu_user
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    networks:
      - feiniu-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fnuser -d feiniu_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存 - 保持不变
  redis:
    image: redis:7-alpine
    container_name: feiniu-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    ports:
      - "16379:6379"
    networks:
      - feiniu-network

  # 后端服务 - 使用Docker镜像
  backend:
    image: ghcr.io/cnliubei/embyhub-backend:latest
    container_name: feiniu-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./bin:/app/bin
    ports:
      - "54680:8080"
    networks:
      - feiniu-network

  # 前端服务 - 使用Docker镜像
  frontend:
    image: ghcr.io/cnliubei/embyhub-frontend:latest
    container_name: feiniu-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "54681:80"
    networks:
      - feiniu-network

networks:
  feiniu-network:
    driver: bridge
