version: '3.8'

# 本地开发用 - 只启动数据库和缓存服务
services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: embyhub-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fnuser
      POSTGRES_PASSWORD: fnuser123
      POSTGRES_DB: feiniu_user
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fnuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: embyhub-dev-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
  redis_dev_data:
